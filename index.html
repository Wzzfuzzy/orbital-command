<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL COMMAND | FAIL-SAFE VERSION</title>
    
    <script src="https://ajax.googleapis.com/ajax/libs/cesiumjs/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://ajax.googleapis.com/ajax/libs/cesiumjs/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: #00cfec; font-family: sans-serif; }
        #cesiumContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .panel { 
            position: absolute; top: 10px; left: 10px; z-index: 9999; 
            background: rgba(0, 10, 20, 0.9); border: 2px solid #00cfec; 
            padding: 10px; width: 240px; border-radius: 4px;
            pointer-events: auto;
        }
        #statusBox { font-size: 10px; margin-top: 5px; color: #ffcc00; }
        .group { margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #1a3a5a; }
    </style>
</head>
<body>

<div class="panel">
    <h3 style="margin:0 0 5px 0; font-size: 14px;">COMMAND CENTER</h3>
    <div class="group">
        <label style="font-size: 11px;">TIME MULTIPLIER</label>
        <input type="range" id="tSlider" min="1" max="10000" value="1" style="width:100%">
    </div>
    <div id="statusBox">
        GLOBE: <span id="s-globe">INIT...</span><br>
        SATS: <span id="s-sat">0</span>
    </div>
</div>

<div id="cesiumContainer"></div>

<script>
    // 1. HARD-CODED TOKEN
    const MY_TOKEN = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5ZDUxYjEwYS1kNTZhLTQ0MjItOTgyYy1kNjNmYTU1ZmI5NDMiLCJpZCI6Mzk4MDI1LCJpYXQiOjE3NzI2MzkzNDl9.OxyMfxGEJzV-p2WjixEXb00CxBOgPtUHUehfwq29Vo0';
    Cesium.Ion.defaultAccessToken = MY_TOKEN;

    let viewer;

    // 2. INITIALIZE WITH FORCED VISIBILITY
    try {
        viewer = new Cesium.Viewer('cesiumContainer', {
            // If Ion fails, this OpenStreetMap layer WILL show the Earth
            baseLayer: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
                url: 'https://tile.openstreetmap.org/'
            })),
            terrain: Cesium.Terrain.fromWorldTerrain(),
            animation: true, // Forces the bottom date/time wheel to show
            timeline: true,  // Forces the bottom slider to show
            fullscreenButton: false,
            infoBox: false
        });
        document.getElementById('s-globe').innerText = "ONLINE";
    } catch (e) {
        document.getElementById('s-globe').innerText = "CRASHED";
        console.error(e);
    }

    // 3. SATELLITE LOGIC
    const satPoints = viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());
    const satellites = [];

    async function loadSats() {
        // Aggressive proxy bypass
        const proxy = "https://api.allorigins.win/raw?url=";
        const target = encodeURIComponent("https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle");
        
        try {
            const response = await fetch(proxy + target);
            const data = await response.text();
            const lines = data.split('\n');
            
            for (let i = 0; i < lines.length; i += 3) {
                if (lines[i+1] && lines[i+1].includes('1 ')) {
                    satellites.push({
                        satrec: satellite.twoline2satrec(lines[i+1], lines[i+2]),
                        point: satPoints.add({
                            position: Cesium.Cartesian3.ZERO,
                            color: Cesium.Color.CYAN,
                            pixelSize: 4
                        })
                    });
                }
            }
            document.getElementById('s-sat').innerText = satellites.length;
        } catch (err) {
            document.getElementById('s-sat').innerText = "DATA ERROR";
        }
    }

    // 4. THE CLOCK LOOP
    viewer.scene.postUpdate.addEventListener(() => {
        const now = Cesium.JulianDate.toDate(viewer.clock.currentTime);
        const gmst = satellite.gstime(now);

        satellites.forEach(s => {
            const pv = satellite.propagate(s.satrec, now);
            if (pv.position) {
                const gd = satellite.eciToGeodetic(pv.position, gmst);
                s.point.position = Cesium.Cartesian3.fromDegrees(
                    satellite.degreesLong(gd.longitude),
                    satellite.degreesLat(gd.latitude),
                    gd.height * 1000
                );
            }
        });
    });

    // 5. SLIDER LINK
    document.getElementById('tSlider').oninput = (e) => {
        viewer.clock.multiplier = e.target.value;
    };

    loadSats();
</script>
</body>
</html>
