<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ORBITAL COMMAND | GOOGLE 3D EDITION</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: #00cfec; font-family: 'Courier New', monospace; }
        #cesiumContainer { width: 100%; height: 100%; position: absolute; }
        .panel { position: absolute; top: 15px; left: 15px; z-index: 999; background: rgba(5,15,25,0.9); border: 2px solid #00cfec; padding: 15px; width: 280px; border-radius: 4px; }
        .group { margin-bottom: 10px; border-bottom: 1px solid #1a3a5a; padding-bottom: 10px; font-size: 11px; }
        #statusBox { font-size: 10px; color: #ffcc00; margin-top: 10px; }
        input[type="range"] { width: 100%; }
    </style>
</head>
<body>

<div class="panel">
    <h1>GOOGLE 3D COMMAND</h1>
    <div class="group">
        <label><input type="checkbox" id="toggleGoogle" checked> 🌍 GOOGLE 3D BUILDINGS</label>
        <label><input type="checkbox" id="toggleSats" checked> 🛰️ ACTIVE SATELLITES</label>
    </div>
    <div class="group">
        <label>TIME SPEED: <span id="speedVal">1</span>x</label>
        <input type="range" id="timeSlider" min="1" max="5000" value="1">
    </div>
    <div id="statusBox">SYSTEM: <span id="s-net">ATTEMPTING BYPASS...</span></div>
</div>

<div id="cesiumContainer"></div>

<script>
    // 1. USE YOUR TOKEN
    Cesium.Ion.defaultAccessToken = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5ZDUxYjEwYS1kNTZhLTQ0MjItOTgyYy1kNjNmYTU1ZmI5NDMiLCJpZCI6Mzk4MDI1LCJpYXQiOjE3NzI2MzkzNDl9.OxyMfxGEJzV-p2WjixEXb00CxBOgPtUHUehfwq29Vo0';

    const viewer = new Cesium.Viewer('cesiumContainer', {
        terrain: Cesium.Terrain.fromWorldTerrain(),
        animation: false, timeline: false
    });

    // 2. ADD GOOGLE EARTH 3D TILES
    async function addGoogle3D() {
        try {
            const tileset = await Cesium.createGooglePhotorealistic3DTileset();
            viewer.scene.primitives.add(tileset);
        } catch (error) {
            console.log("Google Tiles require Google API Key in Ion Dashboard");
        }
    }
    addGoogle3D();

    const satPoints = viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());
    const satellites = [];

    // 3. THE "BYPASS" LOADER
    async function bypassBlock() {
        // We use a different proxy that wraps the data in a way browsers trust more
        const proxy = "https://api.codetabs.com/v1/proxy?quest=";
        const target = "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle";
        
        try {
            const response = await fetch(proxy + target);
            const data = await response.text();
            const lines = data.split('\n');
            
            for (let i = 0; i < lines.length; i += 3) {
                if (lines[i+1] && lines[i+1].includes('1 ')) {
                    const point = satPoints.add({
                        position: Cesium.Cartesian3.ZERO,
                        color: Cesium.Color.CYAN,
                        pixelSize: 3
                    });
                    satellites.push({ name: lines[i], satrec: satellite.twoline2satrec(lines[i+1], lines[i+2]), point });
                }
            }
            document.getElementById('s-net').innerText = "ONLINE: " + satellites.length + " SATS";
        } catch (e) {
            document.getElementById('s-net').innerHTML = "<span style='color:red'>SECURITY BLOCK: USE FIREFOX</span>";
        }
    }

    viewer.scene.postUpdate.addEventListener(() => {
        const now = Cesium.JulianDate.toDate(viewer.clock.currentTime);
        const gmst = satellite.gstime(now);
        satellites.forEach(sat => {
            const pv = satellite.propagate(sat.satrec, now);
            if (pv.position) {
                const gd = satellite.eciToGeodetic(pv.position, gmst);
                sat.point.position = Cesium.Cartesian3.fromDegrees(
                    satellite.degreesLong(gd.longitude),
                    satellite.degreesLat(gd.latitude),
                    gd.height * 1000
                );
            }
        });
    });

    document.getElementById('timeSlider').oninput = (e) => {
        viewer.clock.multiplier = e.target.value;
        document.getElementById('speedVal').innerText = e.target.value;
    };

    bypassBlock();
</script>
</body>
</html>
